{% extends "base.html" %}

{% block content %}
<div class="row gx-4">
  <div class="col-md-4">
    <div class="card p-3 shadow-sm">
      <h5>Parametre úveru</h5>
      <form id="calcForm">
        <div class="mb-2">
          <label class="form-label">Výška úveru (€)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="loan_amount" value="100000">
        </div>
        <div class="mb-2">
          <label class="form-label">Ročná úroková sadzba (%)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="annual_rate" value="3.5">
        </div>
        <div class="mb-2">
          <label class="form-label">Doba splácania (roky)</label>
          <input type="number" min="1" class="form-control" id="years" value="20">
        </div>
        <div class="mb-2">
          <label class="form-label">Dátum prvej splátky</label>
          <input type="date" class="form-control" id="first_payment" value="">
        </div>

        <h5 class="mt-3">Parametre poistenia</h5>
        <div class="mb-2">
          <label class="form-label">Poistná suma (€)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="insurance_sum" value="100000">
        </div>
        <div class="mb-2">
          <label class="form-label">Poistná doba (roky)</label>
          <input type="number" min="0" class="form-control" id="insurance_years" value="20">
        </div>
        <div class="mb-2">
          <label class="form-label">Navýšenie PS (%) (voliteľné)</label>
          <input type="number" step="0.01" min="0" class="form-control" id="increase_pct" placeholder="0">
        </div>

        <div class="d-grid gap-2">
          <button id="calculateBtn" type="button" class="btn btn-primary">Vypočítať</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-md-8">
    <div id="alerts"></div>

    <div class="card p-3 shadow-sm mb-3">
      <canvas id="mainChart" height="150"></canvas>
    </div>

    <div class="card p-3 shadow-sm">
      <div class="d-flex justify-content-between mb-2">
        <h6>Tabuľka splátok</h6>
        <div>
          <button id="exportCsv" class="btn btn-outline-secondary btn-sm">Export CSV</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm" id="scheduleTable">
          <thead>
            <tr>
              <th>Mesiac</th>
              <th>Dátum</th>
              <th>Splátka</th>
              <th>Úrok</th>
              <th>Istina</th>
              <th>Zostatok</th>
              <th>Poistná suma</th>
              <th>Rozdiel</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

{% endblock %}
